name: Desplegar la versión real (Cloud Run)

# Versión real de Lona en Google Cloud Run (ADR-005, docs/PRODUCCION.md). Se lanza a mano desde la pestaña Actions
# («Run workflow»), eligiendo la etiqueta o rama a publicar. No se despliega sola al fusionar: la versión real cambia
# solo cuando alguien lo decide, después de probar en la demo. Solo puede lanzarlo quien tiene permiso de escritura en el
# repositorio (el fundador). El paso de aprobación del entorno «produccion» se quitó el 17-10-2026: los repositorios
# privados del plan gratuito de GitHub no tienen entornos, y sus secretos dejarían de llegar.
#
# Sin claves guardadas en GitHub: la autenticación con Google es por Workload Identity Federation.
# Variables del repositorio (Settings → Secrets and variables → Actions → Variables):
#   GCP_PROJECT_ID, GCP_REGION (europe-west1), GCP_WIF_PROVIDER, GCP_DEPLOY_SA, GCP_RUN_SA, PROD_URL
#   y, para la app, GOOGLE_CLIENT_ID, RESPONSABLE_NOMBRE y TITULAR_* (aviso legal) cuando existan.
# Secreto general del repositorio (Settings → Secrets and variables → Actions → Secrets):
#   PROD_DATABASE_URL_DIRECT  (conexión DIRECTA de Neon, sin «-pooler»; solo para aplicar las migraciones)
# Las claves de la aplicación viven en Secret Manager; el despliegue solo las enlaza por su nombre (docs/PRODUCCION.md).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Etiqueta o rama a publicar (por ejemplo v0.13.0)"
        required: true

concurrency:
  group: produccion
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROYECTO: ${{ vars.GCP_PROJECT_ID }}
      IMAGEN: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/lona/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Preparar la configuración de la app
        # Variables públicas (docs/PRODUCCION.md) y secretos de Secret Manager que ya tienen valor. Así el primer despliegue
        # ya arranca configurado y nadie tiene que copiar ajustes a mano en Cloud Run. Los valores secretos nunca pasan por aquí:
        # Cloud Run los lee de Secret Manager con la cuenta lona-web. La cuenta que despliega solo ve si existen (Secret Manager Viewer).
        env:
          APP_URL: ${{ vars.PROD_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          RESPONSABLE_NOMBRE: ${{ vars.RESPONSABLE_NOMBRE }}
          TITULAR_NOMBRE: ${{ vars.TITULAR_NOMBRE }}
          TITULAR_NIF: ${{ vars.TITULAR_NIF }}
          TITULAR_DOMICILIO: ${{ vars.TITULAR_DOMICILIO }}
          TITULAR_REGISTRO: ${{ vars.TITULAR_REGISTRO }}
        run: |
          VARS="APP_URL=${APP_URL:-https://lonaclub.es}|MAIL_FROM=Lona <avisos@lonaclub.es>|CONTACT_EMAIL=info@lonaclub.es|TRUSTED_PROXY_HOPS=1"
          for V in GOOGLE_CLIENT_ID RESPONSABLE_NOMBRE TITULAR_NOMBRE TITULAR_NIF TITULAR_DOMICILIO TITULAR_REGISTRO; do
            if [ -n "${!V}" ]; then VARS="$VARS|$V=${!V}"; fi
          done
          tiene_valor() { gcloud secrets versions list "$1" --project "$PROYECTO" --filter="state=ENABLED" --limit=1 --format="value(name)" 2>/dev/null | grep -q .; }
          SECRETOS=""
          for S in DATABASE_URL GOOGLE_CLIENT_SECRET RESEND_API_KEY CRON_SECRET CREADOR_CORREO SENTRY_DSN; do
            if tiene_valor "$S"; then SECRETOS="$SECRETOS,$S=$S:latest"; else echo "::warning::El secreto $S aún no tiene valor en Secret Manager: la app arranca sin él."; fi
          done
          case "$SECRETOS" in *DATABASE_URL=*) ;; *) echo "::error::Falta el valor del secreto DATABASE_URL (conexión pooled de Neon) en Secret Manager"; exit 1 ;; esac
          # R2 va entero o no va: a medias la app no arranca (lib/common/env.ts). Sin R2, las fotos se guardan en la base.
          R2_LISTO=si
          for S in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do tiene_valor "$S" || R2_LISTO=no; done
          if [ "$R2_LISTO" = si ]; then
            SECRETOS="$SECRETOS,R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest,R2_BUCKET=R2_BUCKET:latest"
            VARS="$VARS|R2_JURISDICCION=eu"
          else
            echo "::warning::R2 sin completar: las fotos se guardarán en la base de datos y los vídeos solo con enlace."
          fi
          echo "VARS_APP=^|^$VARS" >> "$GITHUB_ENV"
          echo "SECRETOS_APP=${SECRETOS#,}" >> "$GITHUB_ENV"

      - name: Compilar y subir la imagen
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build --build-arg GIT_COMMIT="$(git rev-parse HEAD)" -t "$IMAGEN:$(git rev-parse --short HEAD)" .
          docker push "$IMAGEN:$(git rev-parse --short HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Aplicar las migraciones
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_DIRECT }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Falta el secreto PROD_DATABASE_URL_DIRECT"; exit 1; fi
          npm ci --include=dev
          npx prisma migrate deploy

      - name: Publicar en Cloud Run
        env:
          # La app funciona con su propia cuenta (lona-web), que solo puede leer sus claves; sin la variable, la de por defecto del proyecto.
          CUENTA_APP: ${{ vars.GCP_RUN_SA }}
        run: |
          gcloud run deploy lona \
            --project "$PROYECTO" --region "$REGION" \
            --image "$IMAGEN:$(git rev-parse --short HEAD)" \
            ${CUENTA_APP:+--service-account "$CUENTA_APP"} \
            --update-env-vars "$VARS_APP" --update-secrets "$SECRETOS_APP" \
            --min-instances 0 --max-instances 2 --memory 512Mi --cpu 1 --cpu-throttling \
            --concurrency 40 --timeout 60 --allow-unauthenticated --quiet

      - name: Comprobar /salud
        run: |
          URL=$(gcloud run services describe lona --project "$PROYECTO" --region "$REGION" --format 'value(status.url)')
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "$URL/salud" || echo "000")
            echo "Intento $i: $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::La versión publicada no responde bien en /salud"; exit 1
