name: Mantener despierta la demo

# El plan gratuito de Render duerme el servicio tras 15 minutos sin visitas y despertarlo tarda; la primera
# carga en el móvil se hacía muy lenta. Una visita a /salud cada 10 minutos lo evita. Consume horas del plan
# gratuito de Render (750 h al mes, suficientes para un único servicio encendido todo el mes).
# GitHub puede retrasar las ejecuciones programadas unos minutos; no garantiza el intervalo exacto.
#
# DESACTIVADA la ejecución automática el 13 de octubre de 2026 al pasar el repositorio a privado (ADR-004): cada visita
# cuenta como un minuto de GitHub Actions y, cada 10 minutos, suman unos 4.300 al mes, más que los 2.000 gratuitos de un
# repositorio privado. La sustituye un monitor de UptimeRobot (gratuito, aprobado en ADR-003) que visita /salud cada 5
# minutos sin gastar minutos de GitHub; pasos en docs/DEMO.md. Este flujo queda para lanzarlo a mano si hace falta.
on:
  workflow_dispatch:

jobs:
  visitar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar /salud
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 120 https://ring-espana-demo.onrender.com/salud || echo "000")
          echo "Estado: $STATUS"
          [ "$STATUS" = "200" ]
