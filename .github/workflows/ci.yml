name: CI

# Cuándo se ejecuta (13 de octubre de 2026, repositorio privado: docs/decisiones/ADR-004-repositorio-privado.md).
# Un repositorio privado gratuito tiene 2.000 minutos de GitHub Actions al mes; antes, en público, eran ilimitados y cada cambio
# se probaba dos veces (al subirlo a su rama y en su PR). Ahora:
#  - en cada PR (y en cada cambio que se suba a un PR abierto): es donde se decide si algo entra;
#  - al fusionar en la rama de la demo (claude/ring-espana-mvp), para confirmar el resultado final;
#  - a mano, con el botón «Run workflow» de la pestaña Actions.
# Subir a una rama sin PR ya no gasta minutos: abre el PR cuando quieras que se pruebe.
on:
  pull_request:
  push:
    branches: [claude/ring-espana-mvp]
  workflow_dispatch:

permissions:
  contents: read

# Una ejecución nueva de la misma rama cancela la anterior que siga en curso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # 30 minutos: desde el 13 de octubre de 2026 la accesibilidad se mide en los dos temas (claro y oscuro).
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ringespana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ringespana
      BASE_URL: http://localhost:3111
      APP_URL: http://localhost:3111
      MAIL_TRANSPORT: log
      MAIL_LOG: ${{ github.workspace }}/server.log
      # Sin salida a internet: las pruebas insertan sus noticias; los vídeos de prueba se guardan en una carpeta temporal.
      NEWS_FETCH: "no"
      # Sin buscar direcciones de gimnasios en OpenStreetMap (lib/common/geo.ts): no hay salida a internet.
      GEOCODIFICAR: "no"
      # Cuenta del creador de las pruebas (tests/e2e/creador.mjs).
      CREADOR_CORREO: creador@prueba.test
      MEDIA_DIR: /tmp/ring-subidas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar las migraciones a la base de datos vacía
        run: npx prisma migrate deploy
      - name: Comprobar que las migraciones reproducen exactamente el esquema
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Comprobar cobertura y vigencia de la documentación del código
        run: |
          node --test tests/documentacion/catalogo.test.mjs
          node scripts/generar-catalogo.mjs --comprobar
      - run: npm run typecheck
      - name: Comprobar que el mapa funcional está al día (npm run mapa)
        run: npm run mapa:comprobar
      - run: npm test
      - run: npm run build
      - name: Instalar Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Comprobar controles y diseño compartidos sin base de datos
        run: node tests/browser/optimizacion.mjs
      - name: Arrancar servidor
        run: |
          npx next start -p 3111 > "$MAIL_LOG" 2>&1 &
          npx wait-on -t 60000 http://localhost:3111/registro
      - name: Prueba de extremo a extremo
        # Los fallos («FAIL»/«FALLO») y errores se publican también como avisos del CI, para leerlos en el PR sin descargar el registro.
        run: |
          set -o pipefail; mkdir -p test-results
          npm run test:e2e 2>&1 | tee test-results/e2e.log || { grep -E "^(FAIL|FALLO)|Error|rror:" -A3 test-results/e2e.log | head -40 | sed 's/^/::error::/'; exit 1; }
      - name: Medición de accesibilidad (WCAG 2.2 AA)
        run: npm run test:a11y
      - name: Comprobar experiencia gráfica en una demo independiente
        run: |
          DEMO_MODE=si EXPERIENCE_LAB=si npx next start -p 3112 > test-results/experience-server.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3112/laboratorio
          BASE_URL=http://localhost:3112 node tests/browser/experiencia.mjs
          BASE_URL=http://localhost:3112 node tests/browser/adaptacion.mjs
      - name: Capturas de las pruebas de navegador si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-pruebas
          path: test-results/
          if-no-files-found: ignore
      - name: Log del servidor si algo falla
        if: failure()
        run: tail -n 100 "$MAIL_LOG" || true
