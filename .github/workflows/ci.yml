name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: escenarios
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/escenarios
      BASE_URL: http://localhost:3141
      APP_URL: http://localhost:3141
      MAIL_TRANSPORT: log
      MAIL_LOG: ${{ github.workspace }}/dev-servidor.log
      NEWS_FETCH: "no"
      GEOCODIFICAR: "no"
      DEMO_MODE: "si"
      CREADOR_CORREO: creador@prueba.test
      MEDIA_DIR: /tmp/lona-diagnostico-subidas
      FOTOS_EN_DISCO: "si"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base exclusivamente ficticia y cliente aislado del runner
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run db:seed
          node scripts/copiar-maplibre.mjs
          npx playwright-core install --with-deps chromium
      - name: Diagnóstico completo de React sin cambiar afirmaciones
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='tests/e2e/escenarios.mjs';
          const s=fs.readFileSync(p,'utf8');
          const needle='  const p = await ctx.newPage();';
          if (!s.includes(needle)) throw new Error('No se encuentra el punto de instrumentación');
          fs.writeFileSync(p,s.replace(needle,needle+'\n  p.on("pageerror", e => console.error("DIAG-PAGINA", nombre, p.url(), e.stack ?? e.message));\n  p.on("console", m => { if (m.type() === "error") console.error("DIAG-CONSOLA", nombre, p.url(), m.text()); });'));
          NODE
          node node_modules/next/dist/bin/next dev --port 3141 --hostname 127.0.0.1 > "$MAIL_LOG" 2>&1 &
          npx wait-on -t 90000 http://localhost:3141/salud
      - name: Dos repeticiones de los dos recorridos afectados
        run: |
          set -o pipefail
          mkdir -p test-results/diagnostico
          for intento in 1 2; do
            ESC_DIR="test-results/diagnostico/intento-$intento" node tests/e2e/escenarios.mjs peleador moderadora 2>&1 | tee "test-results/diagnostico/intento-$intento.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico-hidratacion-pr91
          path: |
            test-results/diagnostico/
            dev-servidor.log
