# Despliegue de la DEMOSTRACIÓN en Render (render.com): una web con datos ficticios.
# Desde el 14-10-2026 su base está en Neon (proyecto «lona-demo», Fráncfort), porque la base gratuita de Render caduca
# a los 30 días. La dirección de la base se pega en el panel de Render (DATABASE_URL), nunca aquí. Detalle en docs/PRODUCCION.md.
# Uso: en Render, «New» → «Blueprint» → elegir este repositorio. Detalle en docs/DEMO.md.
# No es la configuración de producción: aquí DEMO_MODE=si y los correos se escriben en el registro en vez de enviarse.
services:
  - type: web
    name: ring-espana-demo
    runtime: node
    plan: free
    region: frankfurt
    branch: claude/ring-espana-mvp
    buildCommand: npm ci --include=dev && npm run build
    startCommand: bash scripts/arranque-demo.sh
    healthCheckPath: /salud
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Conexión «pooled» del proyecto Neon «lona-demo».
      - key: DATABASE_URL
        sync: false
      - key: DEMO_MODE
        value: "si"
      - key: MAIL_TRANSPORT
        value: log
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # Cuenta del creador (docs/CREADOR.md): el correo se escribe en el panel de Render, no aquí.
      - key: CREADOR_CORREO
        sync: false
      # Clave del cron de noticias (.github/workflows/actualizar-noticias.yml): el mismo valor va en los secretos de GitHub.
      - key: CRON_SECRET
        sync: false
      # Entrar con Google (docs/GOOGLE.md): se pegan en el panel de Render, nunca aquí. Sin ellas el botón no aparece.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
